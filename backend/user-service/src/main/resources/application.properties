spring.application.name=user-service
server.port=8082

spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:webstaurator_db}
spring.datasource.username=${POSTGRES_USER:webstaurator}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=postgresql
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Internal API
internal.api-key=${INTERNAL_API_KEY:changeme-dev}

# AWS S3 (obiekty: avatar użytkownika). Puste aws.s3.endpoint = prawdziwy AWS (prod/EKS, IRSA).
# Domyślnie wskazuje na floci (patrz docker-compose.yml) — dev bez konta AWS.
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:webstaurator-media}
aws.s3.presign-ttl-minutes=${AWS_S3_PRESIGN_TTL_MINUTES:15}

# Multipart upload (avatar użytkownika)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Actuator — osobny, unikalny port (nie 8082, nie ten sam co inne serwisy), address=0.0.0.0
# żeby Prometheus w Dockerze dobił się przez host.docker.internal. Patrz monitoring/prometheus.yml.
management.server.port=9092
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# OpenTelemetry (tracing) — 1.0 = trace everything, dev only
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://${JAEGER_HOST:localhost}:4318/v1/traces
