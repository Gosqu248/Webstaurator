spring.application.name=auth-service
server.port=8081

spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:webstaurator_db}
spring.datasource.username=${POSTGRES_USER:webstaurator}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=postgresql

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis (2FA codes + password reset tokens)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:changeme}

# Auth tokens
auth.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:900000}
auth.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:604800000}
auth.cookie.secure=false
auth.cookie.path=/auth/refresh
auth.cookie.name=refreshToken
auth.frontend-url=${FRONTEND_URL:http://localhost:4200}
auth.password-reset-token-ttl-hours=${PASSWORD_RESET_TTL_HOURS:24}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:webstaurator@localhost}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google


# Actuator — port 9090 isolated from public traffic (Prometheus scrapes directly)
management.server.port=9090
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

internal.api-key=${INTERNAL_API_KEY:changeme-dev}
