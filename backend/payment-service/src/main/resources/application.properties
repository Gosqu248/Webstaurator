spring.application.name=payment-service
server.port=8085

spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:webstaurator_db}
spring.datasource.username=${POSTGRES_USER:webstaurator}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=postgresql
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gosqu.payment.*,com.gosqu.order.*
spring.kafka.consumer.auto-offset-reset=earliest

# PayU
payu.pos-id=${PAYU_POS_ID:}
payu.second-key=${PAYU_SECOND_KEY:}
payu.client-id=${PAYU_CLIENT_ID:}
payu.client-secret=${PAYU_CLIENT_SECRET:}
payu.api-base-url=https://secure.snd.payu.com

# Actuator
management.server.port=9090
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
