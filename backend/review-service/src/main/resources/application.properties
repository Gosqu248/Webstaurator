spring.application.name=review-service
server.port=8088
spring.threads.virtual.enabled=true
# MongoDB
spring.mongodb.uri=mongodb://${MONGO_USER:webstaurator}:${MONGO_PASSWORD:changeme}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:webstaurator_db}?authSource=admin
spring.mongodb.representation.uuid=standard
# Kafka — wspólne ustawienia w common/kafka-defaults.properties (moduł common)
spring.config.import=classpath:kafka-defaults.properties
spring.kafka.consumer.group-id=review-service-group
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gosqu.review.*
# Internal API (for calling restaurant-service)
internal.api-key=${INTERNAL_API_KEY:changeme-dev}
services.restaurant-service.url=${RESTAURANT_SERVICE_URL:http://localhost:8083}
# Timeout dla RestClient.Builder autokonfigurowanego przez Spring Boot (RestaurantClient)
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=2s
# Resilience4j — bezpośrednie wywołanie REST do restaurant-service (RestaurantClient.getOwnerId)
resilience4j.circuitbreaker.instances.restaurant-service.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.restaurant-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.restaurant-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.restaurant-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.restaurant-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.restaurant-service.slowCallDurationThreshold=1500ms
resilience4j.circuitbreaker.instances.restaurant-service.slowCallRateThreshold=80
# 4xx (np. restauracja nie istnieje) to błąd biznesowy, nie awaria infrastruktury — nie liczymy go do failure rate
resilience4j.circuitbreaker.instances.restaurant-service.ignoreExceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.retry.instances.restaurant-service.maxAttempts=3
resilience4j.retry.instances.restaurant-service.waitDuration=200ms
resilience4j.retry.instances.restaurant-service.retryExceptions=java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException
resilience4j.bulkhead.instances.restaurant-service.maxConcurrentCalls=15
resilience4j.bulkhead.instances.restaurant-service.maxWaitDuration=0
# Actuator — osobny, unikalny port (nie 8088, nie ten sam co inne serwisy), address=0.0.0.0
# żeby Prometheus w Dockerze dobił się przez host.docker.internal. Patrz monitoring/prometheus.yml.
management.server.port=9098
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers,retries,bulkheads
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# OpenTelemetry (tracing) — 1.0 = trace everything, dev only
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://${JAEGER_HOST:localhost}:4318/v1/traces

