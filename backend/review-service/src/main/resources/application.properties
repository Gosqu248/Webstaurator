spring.application.name=review-service
server.port=8088

spring.threads.virtual.enabled=true

# MongoDB
spring.data.mongodb.uri=mongodb://${MONGO_USER:webstaurator}:${MONGO_PASSWORD:changeme}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:webstaurator_db}?authSource=admin
spring.data.mongodb.uuid-representation=standard

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=review-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gosqu.review.*
spring.kafka.consumer.auto-offset-reset=earliest

# Internal API (for calling restaurant-service)
internal.api-key=${INTERNAL_API_KEY:changeme-dev}
services.restaurant-service.url=${RESTAURANT_SERVICE_URL:http://localhost:8083}

# Actuator
management.server.port=9090
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
