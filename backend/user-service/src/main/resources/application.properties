spring.application.name=user-service
server.port=8082

spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:webstaurator_db}
spring.datasource.username=${POSTGRES_USER:webstaurator}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=postgresql

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.server.port=9090
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
