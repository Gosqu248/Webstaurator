spring.application.name=order-service
server.port=8084

spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:webstaurator_db}
spring.datasource.username=${POSTGRES_USER:webstaurator}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=postgresql
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka — wspólne ustawienia w common/kafka-defaults.properties (moduł common)
spring.config.import=classpath:kafka-defaults.properties
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gosqu.order.*

# Redis — RestaurantAvailabilityCache (Część 1.1)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Internal API (for calling user-service)
internal.api-key=${INTERNAL_API_KEY:changeme-dev}

# Service URLs
services.user-service.url=${USER_SERVICE_URL:http://localhost:8082}
services.restaurant-service.url=${RESTAURANT_SERVICE_URL:http://localhost:8083}

# Timeout dla RestClient.Builder autokonfigurowanego przez Spring Boot (RestaurantClientAdapter, UserAddressClientAdapter)
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=2s

# Resilience4j — bezpośrednie wywołania REST do restaurant-service i user-service (checkout path)
resilience4j.circuitbreaker.instances.restaurant-service.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.restaurant-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.restaurant-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.restaurant-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.restaurant-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.restaurant-service.slowCallDurationThreshold=1500ms
resilience4j.circuitbreaker.instances.restaurant-service.slowCallRateThreshold=80
# 4xx (np. restauracja nie istnieje) to błąd biznesowy, nie awaria infrastruktury — nie liczymy go do failure rate
resilience4j.circuitbreaker.instances.restaurant-service.ignoreExceptions=org.springframework.web.client.HttpClientErrorException

resilience4j.retry.instances.restaurant-service.maxAttempts=3
resilience4j.retry.instances.restaurant-service.waitDuration=200ms
resilience4j.retry.instances.restaurant-service.retryExceptions=java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException

resilience4j.bulkhead.instances.restaurant-service.maxConcurrentCalls=25
resilience4j.bulkhead.instances.restaurant-service.maxWaitDuration=0

resilience4j.circuitbreaker.instances.user-service.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.user-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.user-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.user-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.user-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.user-service.slowCallDurationThreshold=1500ms
resilience4j.circuitbreaker.instances.user-service.slowCallRateThreshold=80
resilience4j.circuitbreaker.instances.user-service.ignoreExceptions=org.springframework.web.client.HttpClientErrorException

resilience4j.retry.instances.user-service.maxAttempts=3
resilience4j.retry.instances.user-service.waitDuration=200ms
resilience4j.retry.instances.user-service.retryExceptions=java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException

resilience4j.bulkhead.instances.user-service.maxConcurrentCalls=25
resilience4j.bulkhead.instances.user-service.maxWaitDuration=0

# Actuator — osobny, unikalny port (nie 8084, nie ten sam co inne serwisy), address=0.0.0.0
# żeby Prometheus w Dockerze dobił się przez host.docker.internal. Patrz monitoring/prometheus.yml.
management.server.port=9094
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers,retries,bulkheads
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# OpenTelemetry (tracing) — 1.0 = trace everything, dev only
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://${JAEGER_HOST:localhost}:4318/v1/traces
