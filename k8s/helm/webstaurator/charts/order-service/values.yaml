replicaCount: 2

image:
  repository: webstaurator/order-service
  tag: latest

service:
  port: 8084

metricsPort: 9094

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

pdb:
  minAvailable: 1

hpa:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70

configMap:
  data:
    POSTGRES_HOST: "postgres.webstaurator-infra.svc.cluster.local"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "webstaurator_db"
    KAFKA_BOOTSTRAP_SERVERS: "kafka.webstaurator-infra.svc.cluster.local:9092"
    USER_SERVICE_URL: "http://user-service:8082"
    RESTAURANT_SERVICE_URL: "http://restaurant-service:8083"
    JAEGER_HOST: "jaeger.webstaurator-monitoring.svc.cluster.local"

# Placeholdery CHANGE_ME — nadpisz przez osobny, niecommitowany plik values (analogicznie do
# services/order-service/secret.yaml, gitignored), NIE edytuj tego pliku z realnymi sekretami.
secret:
  stringData:
    POSTGRES_USER: "CHANGE_ME"
    POSTGRES_PASSWORD: "CHANGE_ME"
    INTERNAL_API_KEY: "CHANGE_ME"

networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8084
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webstaurator-monitoring
      ports:
        - port: 9094
