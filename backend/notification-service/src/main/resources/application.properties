spring.application.name=notification-service
server.port=8086

spring.threads.virtual.enabled=true

# MongoDB
spring.data.mongodb.uri=mongodb://${MONGO_USER:webstaurator}:${MONGO_PASSWORD:changeme}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:webstaurator_db}?authSource=admin
spring.data.mongodb.uuid-representation=standard

# Kafka — UWAGA: to serwis czysto konsumencki, nie potrzebujesz KafkaConfig z @Bean NewTopic
# (topiki tworzą ich producenci: order-service, payment-service)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gosqu.notificationservice.*
spring.kafka.consumer.auto-offset-reset=earliest
# Propagacja trace context przez nagłówki rekordów Kafki (patrz guide 12, sekcja 4)
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Mail (MailDev — docker-compose usluga "maildev", SMTP na 1025, UI na http://localhost:1080)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
notification.mail.from=noreply@webstaurator.local

# Actuator — osobny, unikalny port (nie 8086, nie ten sam co inne serwisy), address=0.0.0.0
# żeby Prometheus w Dockerze dobił się przez host.docker.internal. Patrz monitoring/prometheus.yml.
management.server.port=9096
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers,retries,bulkheads
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# OpenTelemetry (tracing) — 1.0 = trace everything, dev only
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://${JAEGER_HOST:localhost}:4318/v1/traces

internal.api-key=${INTERNAL_API_KEY:changeme-dev}
services.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Timeout dla RestClient.Builder autokonfigurowanego przez Spring Boot (UserClient)
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=2s

# Resilience4j — bezpośrednie wywołanie REST do auth-service (UserClient.getEmail)
resilience4j.circuitbreaker.instances.auth-service.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.auth-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.auth-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.auth-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.auth-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.auth-service.slowCallDurationThreshold=1500ms
resilience4j.circuitbreaker.instances.auth-service.slowCallRateThreshold=80
resilience4j.circuitbreaker.instances.auth-service.ignoreExceptions=org.springframework.web.client.HttpClientErrorException

resilience4j.retry.instances.auth-service.maxAttempts=3
resilience4j.retry.instances.auth-service.waitDuration=200ms
resilience4j.retry.instances.auth-service.retryExceptions=java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException

resilience4j.bulkhead.instances.auth-service.maxConcurrentCalls=15
resilience4j.bulkhead.instances.auth-service.maxWaitDuration=0
