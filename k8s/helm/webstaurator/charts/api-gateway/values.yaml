replicaCount: 2

image:
  repository: webstaurator/api-gateway
  tag: latest

service:
  port: 8080

metricsPort: 9090

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

pdb:
  minAvailable: 1

hpa:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70

configMap:
  data:
    AUTH_SERVICE_URL: "http://auth-service:8081"
    USER_SERVICE_URL: "http://user-service:8082"
    RESTAURANT_SERVICE_URL: "http://restaurant-service:8083"
    ORDER_SERVICE_URL: "http://order-service:8084"
    PAYMENT_SERVICE_URL: "http://payment-service:8085"
    NOTIFICATION_SERVICE_URL: "http://notification-service:8086"
    DELIVERY_SERVICE_URL: "http://delivery-service:8087"
    REVIEW_SERVICE_URL: "http://review-service:8088"
    REDIS_HOST: "redis.webstaurator-infra.svc.cluster.local"
    JAEGER_HOST: "jaeger.webstaurator-monitoring.svc.cluster.local"
    CORS_ALLOWED_ORIGINS: "http://localhost:4200"

# Placeholdery CHANGE_ME — nadpisz przez osobny, niecommitowany plik values (analogicznie do
# services/api-gateway/secret.yaml, gitignored), NIE edytuj tego pliku z realnymi sekretami.
secret:
  stringData:
    REDIS_PASSWORD: "CHANGE_ME"
    AUTH_PUBLIC: "CHANGE_ME_PEM_PUBLIC_KEY"

networkPolicy:
  ingress:
    - {}
