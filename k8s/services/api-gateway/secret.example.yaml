# Szablon — skopiuj jako secret.yaml (gitignored: k8s/**/secret.yaml) i podmień CHANGE_ME.
# AUTH_PUBLIC musi być IDENTYCZNY z AUTH_PUBLIC w auth-service/secret.yaml — to klucz publiczny
# tej samej pary RSA, którą auth-service podpisuje tokeny (RS256). Gateway weryfikuje, nie
# wystawia tokenów, więc dostaje tylko klucz publiczny, nigdy AUTH_PRIVATE.
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: webstaurator
type: Opaque
stringData:
  REDIS_PASSWORD: CHANGE_ME
  AUTH_PUBLIC: |
    -----BEGIN PUBLIC KEY-----
    CHANGE_ME
    -----END PUBLIC KEY-----
