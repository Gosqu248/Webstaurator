# Szablon — skopiuj jako secret.yaml (gitignored: k8s/**/secret.yaml) i podmień CHANGE_ME.
#
# AUTH_PUBLIC musi być IDENTYCZNY z AUTH_PUBLIC w api-gateway/secret.yaml — to ta sama para
# kluczy RSA, auth-service podpisuje RS256 kluczem prywatnym, api-gateway weryfikuje kluczem
# publicznym (JwtUtil.java). Wcześniej api-gateway weryfikował osobnym sekretem HMAC — niekompatybilnym
# algorytmem, więc żaden token z auth-service nie przechodził przez gateway. Naprawione.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: webstaurator
type: Opaque
stringData:
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  REDIS_PASSWORD: CHANGE_ME
  GOOGLE_CLIENT_ID: CHANGE_ME
  GOOGLE_CLIENT_SECRET: CHANGE_ME
  INTERNAL_API_KEY: CHANGE_ME
  # Wklej pełną zawartość PEM (z nagłówkami -----BEGIN/END-----) — JwtConfig.readKeyFromPath()
  # zwraca wartość bez zmian, gdy nie zaczyna się od "classpath:"/"file:", więc inline PEM działa.
  AUTH_PRIVATE: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME
    -----END PRIVATE KEY-----
  AUTH_PUBLIC: |
    -----BEGIN PUBLIC KEY-----
    CHANGE_ME
    -----END PUBLIC KEY-----
