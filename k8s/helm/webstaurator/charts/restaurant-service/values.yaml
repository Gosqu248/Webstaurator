replicaCount: 2

image:
  repository: webstaurator/restaurant-service
  tag: latest

service:
  port: 8083

metricsPort: 9093

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

pdb:
  minAvailable: 1

hpa:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70

configMap:
  data:
    POSTGRES_HOST: "postgres.webstaurator-infra.svc.cluster.local"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "webstaurator_db"
    REDIS_HOST: "redis.webstaurator-infra.svc.cluster.local"
    REDIS_PORT: "6379"
    ELASTICSEARCH_HOST: "elasticsearch.webstaurator-infra.svc.cluster.local"
    ELASTICSEARCH_PORT: "9200"
    KAFKA_BOOTSTRAP_SERVERS: "kafka.webstaurator-infra.svc.cluster.local:9092"
    JAEGER_HOST: "jaeger.webstaurator-monitoring.svc.cluster.local"
    AWS_S3_ENDPOINT: ""
    AWS_REGION: "us-east-1"
    AWS_S3_BUCKET: "webstaurator-media"

# Placeholdery CHANGE_ME — nadpisz przez osobny, niecommitowany plik values (analogicznie do
# services/restaurant-service/secret.yaml, gitignored), NIE edytuj tego pliku z realnymi sekretami.
secret:
  stringData:
    POSTGRES_USER: "CHANGE_ME"
    POSTGRES_PASSWORD: "CHANGE_ME"
    INTERNAL_API_KEY: "CHANGE_ME"

networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: order-service
        - podSelector:
            matchLabels:
              app: review-service
      ports:
        - port: 8083
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webstaurator-monitoring
      ports:
        - port: 9093
