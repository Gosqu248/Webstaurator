apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-from-services
  namespace: webstaurator-infra
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webstaurator
          podSelector:
            matchLabels:
              app: auth-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webstaurator
          podSelector:
            matchLabels:
              app: user-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webstaurator
          podSelector:
            matchLabels:
              app: restaurant-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webstaurator
          podSelector:
            matchLabels:
              app: order-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webstaurator
          podSelector:
            matchLabels:
              app: payment-service
      ports:
        - port: 5432
