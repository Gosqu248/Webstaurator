# 3-brokerowy klaster Kafka w trybie KRaft (bez ZooKeepera). Każdy pod pełni jednocześnie rolę
# broker+controller (process.roles=broker,controller) — wymaga StatefulSet, bo protokół KRaft
# identyfikuje węzły po stabilnym, numerycznym node.id powiązanym ze stałą tożsamością sieciową
# (kafka-0, kafka-1, kafka-2), a nie po losowym IP jak w zwykłym Deployment.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: webstaurator-infra
spec:
  serviceName: kafka-headless
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          # Oficjalny obraz apache/kafka ma ENTRYPOINT /__cacert_entrypoint.sh (no-op passthrough,
          # jeśli nie ustawiono USE_SYSTEM_CA_CERTS) i CMD /etc/kafka/docker/run. Nadpisujemy
          # command/args, żeby przed uruchomieniem run wyliczyć KAFKA_NODE_ID jako liczbę całkowitą
          # z sufiksu nazwy poda (kafka-0 -> 0, kafka-1 -> 1, ...) — KRaft wymaga inta, a
          # fieldRef: metadata.name dałby string "kafka-0", którego Kafka nie akceptuje.
          command: ["/bin/bash", "-c"]
          args:
            - |
              export KAFKA_NODE_ID=${POD_NAME##*-}
              exec /etc/kafka/docker/run
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # POD_NAME jest zadeklarowany wcześniej w tej samej liście env, więc kubelet potrafi go
            # podstawić w KAFKA_ADVERTISED_LISTENERS przez składnię $(POD_NAME) (natywna
            # dependent-env substitution k8s — działa tylko wewnątrz jednej listy `env:`, nie
            # zadziałałaby przez envFrom/configMapRef).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka-headless.webstaurator-infra.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            # Lista głosujących w kworum KRaft: <node-id>@<host>:<controller-port> dla wszystkich
            # 3 brokerów, adresowanych przez stabilne DNS headless Service (kafka-<ordinal>.kafka-headless...).
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka-headless.webstaurator-infra.svc.cluster.local:9093,1@kafka-1.kafka-headless.webstaurator-infra.svc.cluster.local:9093,2@kafka-2.kafka-headless.webstaurator-infra.svc.cluster.local:9093"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          livenessProbe:
            exec:
              command: [ "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
            initialDelaySeconds: 20
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
# Headless Service — dostarcza stabilne DNS per-pod (kafka-0.kafka-headless...), wymagane przez
# KRaft do adresowania konkretnych brokerów w KAFKA_CONTROLLER_QUORUM_VOTERS i KAFKA_ADVERTISED_LISTENERS.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: webstaurator-infra
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
# Zwykły ClusterIP Service — do niego łączą się klienci (restaurant-service, order-service, ...),
# load-balancing między brokerami dla zwykłych połączeń producent/konsument.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: webstaurator-infra
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
  type: ClusterIP
