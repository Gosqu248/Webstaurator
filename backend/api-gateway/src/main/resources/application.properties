resilience4j.circuitbreaker.instances.delivery-service-cb.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.delivery-service-cb.slowCallDurationThreshold=3s
resilience4j.circuitbreaker.instances.delivery-service-cb.slowCallRateThreshold=80
resilience4j.timelimiter.instances.delivery-service-cb.timeoutDuration=4s

