# StatefulSet zamiast Deployment — patrz komentarz w infrastructure/postgres/statefulset.yaml.
# Uwaga: minio nie ma dziś żadnego klienta w kodzie (brak MinioClient/S3Client w repo) — to
# martwa infrastruktura, celowo bez NetworkPolicy zezwalającej na ruch (patrz infrastructure/,
# brak pliku minio/network-policy.yaml, oraz k8s/README.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: webstaurator-infra
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: rootPassword
          volumeMounts:
            - name: minio-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["mc", "ready", "local"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: webstaurator-infra
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: webstaurator-infra
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
