spring.application.name=delivery-service
server.port=8087
spring.threads.virtual.enabled=true
# MongoDB
spring.mongodb.uri=mongodb://${MONGO_USER:webstaurator}:${MONGO_PASSWORD:changeme}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:webstaurator_db}?authSource=admin
spring.mongodb.representation.uuid=standard
# Kafka — wspólne ustawienia w common/kafka-defaults.properties (moduł common)
spring.config.import=classpath:kafka-defaults.properties
spring.kafka.consumer.group-id=delivery-service-group
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gosqu.delivery.*
# Actuator — osobny, unikalny port (nie 8087, nie ten sam co inne serwisy), address=0.0.0.0
# żeby Prometheus w Dockerze dobił się przez host.docker.internal. Patrz monitoring/prometheus.yml.
management.server.port=9097
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# OpenTelemetry (tracing) — 1.0 = trace everything, dev only
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://${JAEGER_HOST:localhost}:4318/v1/traces
