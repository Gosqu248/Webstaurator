apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-service-allow-ingress
  namespace: webstaurator
spec:
  podSelector:
    matchLabels:
      app: payment-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8085
    # Prometheus (namespace webstaurator-monitoring) scrapuje /actuator/prometheus na porcie metryk —
    # bez tej reguły default-deny zablokuje scraping, gdy Prometheus faktycznie tam wyląduje (temat 06).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webstaurator-monitoring
      ports:
        - port: 9095
