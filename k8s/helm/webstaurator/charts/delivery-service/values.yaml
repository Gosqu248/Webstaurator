replicaCount: 2

image:
  repository: webstaurator/delivery-service
  tag: latest

service:
  port: 8087

metricsPort: 9097

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

pdb:
  minAvailable: 1

hpa:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70

configMap:
  data:
    MONGO_HOST: "mongodb.webstaurator-infra.svc.cluster.local"
    MONGO_PORT: "27017"
    MONGO_DB: "webstaurator_db"
    KAFKA_BOOTSTRAP_SERVERS: "kafka.webstaurator-infra.svc.cluster.local:9092"
    JAEGER_HOST: "jaeger.webstaurator-monitoring.svc.cluster.local"

# Placeholdery CHANGE_ME — nadpisz przez osobny, niecommitowany plik values (analogicznie do
# services/delivery-service/secret.yaml, gitignored), NIE edytuj tego pliku z realnymi sekretami.
secret:
  stringData:
    MONGO_USER: "CHANGE_ME"
    MONGO_PASSWORD: "CHANGE_ME"

networkPolicy:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8087
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webstaurator-monitoring
      ports:
        - port: 9097
