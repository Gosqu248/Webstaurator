# UWAGA delivery-service: DeliveryTrackingSseController wystawia stream SSE (NO_TIMEOUT) pod
# /delivery/orders/{orderId}/stream — inny prefiks niż predykat trasy /deliveries/** poniżej, więc
# dziś ten endpoint i tak nie przechodzi przez tę trasę gatewaya. Jeśli ktoś kiedyś ujednolici
# prefiksy (/delivery -> /deliveries), TimeLimiter 4s poniżej urwie streaming — trzeba go wtedy
# wyłączyć dla ścieżki /stream albo wydzielić osobną trasę bez circuitBreakera/timeLimitera.
resilience4j.circuitbreaker.instances.delivery-service-cb.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.delivery-service-cb.slidingWindowSize=10
resilience4j.circuitbreaker.instances.delivery-service-cb.failureRateThreshold=50
