spring.application.name=restaurant-service
server.port=8083

spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:webstaurator_db}
spring.datasource.username=${POSTGRES_USER:webstaurator}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=postgresql

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RFC 7807 problem details
spring.mvc.problemdetails.enabled=true

# Actuator — osobny, unikalny port (nie 8083, nie ten sam co inne serwisy), address=0.0.0.0
# żeby Prometheus w Dockerze dobił się przez host.docker.internal. Patrz monitoring/prometheus.yml.
management.server.port=9093
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# OpenTelemetry (tracing) — 1.0 = trace everything, dev only
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://${JAEGER_HOST:localhost}:4318/v1/traces

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Internal API (called by order-service, review-service, etc.)
internal.api-key=${INTERNAL_API_KEY:changeme-dev}

# AWS S3 (obiekty: logo restauracji). Puste aws.s3.endpoint = prawdziwy AWS (prod/EKS, IRSA).
# Domyślnie wskazuje na floci (patrz docker-compose.yml) — dev bez konta AWS.
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:webstaurator-media}
aws.s3.presign-ttl-minutes=${AWS_S3_PRESIGN_TTL_MINUTES:15}

# Multipart upload (logo restauracji)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Elasticsearch
spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=restaurant-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# UWAGA: celowo zostaje StringDeserializer, nie ErrorHandlingDeserializer+JsonDeserializer jak
# w innych serwisach. RatingUpdatedListener i RestaurantIndexConsumer przyjmują surowy String
# i same parsują JSON przez ObjectMapper w try/catch (patrz te klasy) — zmiana deserializera
# zepsułaby sygnaturę metody (String != zdeserializowany obiekt) i nic by nie zyskała, bo błędy
# parsowania są już przechwytywane i logowane wewnątrz listenera, a nie propagowane do kontenera.
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Niezawodność producenta (Część 2) — RF=1 na jednym brokerze nie daje jeszcze pełnej trwałości,
# ale kontrakt jest gotowy pod przyszły klaster wielobrokerowy.
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
# Ręczny commit offsetu po przetworzeniu rekordu (Część 3.3). Bezpieczne mimo braku DLQ tutaj,
# bo oba listenery łapią wyjątki wewnętrznie (patrz komentarz przy value-deserializer) —
# commit offsetu następuje zawsze po zakończeniu metody, nigdy przed przetworzeniem.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=RECORD
# Propagacja trace context przez nagłówki rekordów Kafki (patrz guide 12, sekcja 4)
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
