spring.application.name=delivery-service
server.port=8087

spring.threads.virtual.enabled=true

# MongoDB
spring.data.mongodb.uri=mongodb://${MONGO_USER:webstaurator}:${MONGO_PASSWORD:changeme}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:webstaurator_db}?authSource=admin
spring.data.mongodb.uuid-representation=standard

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Niezawodność producenta (Część 2) — RF=1 na jednym brokerze nie daje jeszcze pełnej trwałości,
# ale kontrakt jest gotowy pod przyszły klaster wielobrokerowy.
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.consumer.group-id=delivery-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer przechwytuje błędy deserializacji i przekazuje je do DefaultErrorHandler
# (KafkaErrorHandlingConfig), zamiast blokować partycję (Część 3.1).
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gosqu.delivery.*
spring.kafka.consumer.auto-offset-reset=earliest
# Ręczny commit offsetu po przetworzeniu rekordu (Część 3.3)
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=RECORD
# Propagacja trace context przez nagłówki rekordów Kafki (patrz guide 12, sekcja 4)
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Actuator — osobny, unikalny port (nie 8087, nie ten sam co inne serwisy), address=0.0.0.0
# żeby Prometheus w Dockerze dobił się przez host.docker.internal. Patrz monitoring/prometheus.yml.
management.server.port=9097
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# OpenTelemetry (tracing) — 1.0 = trace everything, dev only
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://${JAEGER_HOST:localhost}:4318/v1/traces
