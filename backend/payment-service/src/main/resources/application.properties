spring.application.name=payment-service
server.port=8085

spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:webstaurator_db}
spring.datasource.username=${POSTGRES_USER:webstaurator}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=postgresql
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Niezawodność producenta (Część 2) — RF=1 na jednym brokerze nie daje jeszcze pełnej trwałości,
# ale kontrakt jest gotowy pod przyszły klaster wielobrokerowy.
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer przechwytuje błędy deserializacji i przekazuje je do DefaultErrorHandler
# (KafkaErrorHandlingConfig), zamiast blokować partycję (Część 3.1).
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gosqu.payment.*,com.gosqu.order.*
spring.kafka.consumer.auto-offset-reset=earliest
# Ręczny commit offsetu po przetworzeniu rekordu (Część 3.3)
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=RECORD
# Propagacja trace context przez nagłówki rekordów Kafki (patrz guide 12, sekcja 4)
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Redis — idempotency guard dla webhooka PayU (md/todo-v2/02-redis-mid-senior.md, sekcja 3)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# PayU
payu.pos-id=${PAYU_POS_ID:}
payu.second-key=${PAYU_SECOND_KEY:}
payu.client-id=${PAYU_CLIENT_ID:}
payu.client-secret=${PAYU_CLIENT_SECRET:}
payu.api-base-url=https://secure.snd.payu.com

# Actuator — osobny, unikalny port (nie 8085, nie ten sam co inne serwisy), address=0.0.0.0
# żeby Prometheus w Dockerze dobił się przez host.docker.internal. Patrz monitoring/prometheus.yml.
management.server.port=9095
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# OpenTelemetry (tracing) — 1.0 = trace everything, dev only
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://${JAEGER_HOST:localhost}:4318/v1/traces
