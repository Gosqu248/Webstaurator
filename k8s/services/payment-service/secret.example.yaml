# Szablon — skopiuj jako secret.yaml (gitignored: k8s/**/secret.yaml) i podmień CHANGE_ME.
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secret
  namespace: webstaurator
type: Opaque
stringData:
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  PAYU_POS_ID: CHANGE_ME
  PAYU_SECOND_KEY: CHANGE_ME
  PAYU_CLIENT_ID: CHANGE_ME
  PAYU_CLIENT_SECRET: CHANGE_ME
