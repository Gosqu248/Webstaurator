spring.application.name=api-gateway
server.port=8080
spring.threads.virtual.enabled=true
# Redis (rate limiting + session)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:changeme}
# JWT (same secret as auth-service — injected via env var)
jwt.secret=${JWT_SECRET}
# Service URLs
service.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
service.user-url=${USER_SERVICE_URL:http://localhost:8082}
service.restaurant-url=${RESTAURANT_SERVICE_URL:http://localhost:8083}
service.order-url=${ORDER_SERVICE_URL:http://localhost:8084}
service.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8085}
service.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
service.delivery-url=${DELIVERY_SERVICE_URL:http://localhost:8087}
service.review-url=${REVIEW_SERVICE_URL:http://localhost:8088}
# Actuator — port 9090 isolated from public traffic (Prometheus scrapes directly)
management.server.port=9090
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
# OpenTelemetry (tracing) — 1.0 = trace everything, dev only
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://${JAEGER_HOST:localhost}:4318/v1/traces
rate-limit.public.max=20
rate-limit.auth.max=200
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Resilience4j circuit breaker — identyczne progi na start dla wszystkich 8 serwisów,
# dostroić per serwis po obserwacji realnego zachowania (patrz md/todo/13-resilience4j-circuit-breaker-guide.md)
resilience4j.circuitbreaker.instances.auth-service-cb.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.auth-service-cb.slidingWindowSize=10
resilience4j.circuitbreaker.instances.auth-service-cb.failureRateThreshold=50
resilience4j.circuitbreaker.instances.auth-service-cb.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.auth-service-cb.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.auth-service-cb.slowCallDurationThreshold=3s
resilience4j.circuitbreaker.instances.auth-service-cb.slowCallRateThreshold=80
resilience4j.timelimiter.instances.auth-service-cb.timeoutDuration=4s

