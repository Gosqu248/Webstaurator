# Szablon — skopiuj jako secret.yaml (gitignored, patrz .gitignore: k8s/**/secret.yaml) i
# podmień CHANGE_ME na realne hasło zanim zrobisz `kubectl apply -f k8s/infrastructure/redis/`.
# stringData zamiast data — K8s sam zakoduje wartość do base64 przy apply, nie trzeba robić tego
# ręcznie (patrz md/todo/15-kubernetes-manifests-guide.md, sekcja 2).
apiVersion: v1
kind: Secret
metadata:
  name: redis-password
  namespace: webstaurator-infra
type: Opaque
stringData:
  password: CHANGE_ME
